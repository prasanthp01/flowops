# Independent deployment; never merge this with the local QA override.
# FLOWOPS_IMAGE must identify the reviewed linux/amd64 release artifact.
name: flowops-production
x-app: &app
  image: ${FLOWOPS_IMAGE:?Set FLOWOPS_IMAGE to the verified release image}
  read_only: true
  tmpfs: ["/tmp:size=32m,noexec,nosuid"]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  mem_limit: 192m
  cpus: 0.20
  pids_limit: 100
  logging: &logging
    driver: json-file
    options: {max-size: "5m", max-file: "3"}
  networks: [private]
  environment: &env
    FLOWOPS_DATABASE_URL_FILE: /run/secrets/runtime_url
    FLOWOPS_SIGNING_KEY_FILE: /run/secrets/signing_key
    FLOWOPS_OPERATOR_TOKEN_FILE: /run/secrets/operator_token
    FLOWOPS_ORIGIN: ${FLOWOPS_ORIGIN:?Set the HTTPS origin for your deployment}
    FLOWOPS_ENVIRONMENT: production
  secrets: [runtime_url, signing_key, operator_token]
services:
  db:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    command: [postgres, -c, max_connections=32, -c, shared_buffers=32MB, -c, max_wal_size=128MB, -c, min_wal_size=32MB]
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/admin_password
    secrets: [admin_password, owner_password, runtime_password]
    volumes:
      - database:/var/lib/postgresql
      - ./operations/init-db.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    networks: [private]
    mem_limit: 256m
    cpus: 0.20
    pids_limit: 100
    logging: *logging
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres]
      interval: 3s
      timeout: 2s
      retries: 30
    restart: unless-stopped
  migrate:
    <<: *app
    environment:
      <<: *env
      FLOWOPS_DATABASE_URL_FILE: /run/secrets/owner_url
      FLOWOPS_OPERATOR_TOKEN_FILE: ""
    secrets: [owner_url, signing_key]
    command: [sh, -c, "alembic upgrade head && python -m scripts.grants"]
    depends_on:
      db: {condition: service_healthy}
  api:
    <<: *app
    networks:
      private: {}
      edge: {aliases: [flowops-api]}
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/projects/flowops/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
  worker:
    <<: *app
    healthcheck:
      test: [CMD, python, -m, flowops.worker_health]
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 3
    environment:
      <<: *env
      FLOWOPS_OPERATOR_TOKEN_FILE: ""
    secrets: [runtime_url, signing_key]
    command: [python, -m, flowops.workflow]
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
networks:
  private: {internal: true}
  edge:
    external: true
    name: agentops_edge # Existing persistent portfolio proxy network; API only.
volumes:
  database: {}
secrets:
  admin_password: {file: .local/secrets/admin_password}
  owner_password: {file: .local/secrets/owner_password}
  runtime_password: {file: .local/secrets/runtime_password}
  owner_url: {file: .local/secrets/owner_url}
  runtime_url: {file: .local/secrets/runtime_url}
  signing_key: {file: .local/secrets/signing_key}
  operator_token: {file: .local/secrets/operator_token}
