# Insert inside the existing portfolio HTTPS server after backend readiness.
# Uses the existing agentops_edge network in the shared proxy Compose config.
# Preserve the existing generic /api/projects/ fallback for the other projects.
location = /projects/flowops {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $flowops_upstream http://flowops-api:8000;
    proxy_pass $flowops_upstream$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";
    proxy_set_header Forwarded "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    proxy_buffering off;
    access_log off;
}
location ^~ /projects/flowops/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $flowops_upstream http://flowops-api:8000;
    proxy_pass $flowops_upstream$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";
    proxy_set_header Forwarded "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    proxy_buffering off;
    access_log off;
}
location ^~ /api/projects/flowops/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $flowops_upstream http://flowops-api:8000;
    proxy_pass $flowops_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";
    proxy_set_header Forwarded "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    proxy_send_timeout 10s;
    proxy_buffering off;
    access_log off;
    proxy_cache off;
    client_max_body_size 16k;
}
