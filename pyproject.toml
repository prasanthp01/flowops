[project]
name = "flowops"
version = "0.2.0"
description = "Auditable synthetic order-resolution workflows"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3",
  "sqlalchemy>=2.0.38,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "httpx>=0.28,<1",
  "jsonschema==4.26.0",
  "rfc3339-validator==0.1.4",
  "rfc8785==0.1.4",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1", "mypy>=1.15,<2", "jsonschema>=4.23,<5", "pip-audit>=2.10.1,<3"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["flowops/_vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "flowops._vendor.*"
ignore_errors = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flowops"]
